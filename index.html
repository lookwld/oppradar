<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>交易机会 · 异动雷达 / 盯合约 / MA99 回踩</title>
<!-- 安全策略：只允许连这两家交易所的公开行情接口，任何其他域名一律拦下；
     不外发 Referer；不加载任何外部脚本 / 图片 / 字体。 -->
<meta http-equiv="Content-Security-Policy" content="connect-src https://api.gateio.ws https://fapi.binance.com; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --bg:#0b0e13; --panel:#12161d; --panel2:#171d26; --line:#222b37;
    --txt:#e6edf3; --dim:#8b98a8; --dim2:#5d6b7d;
    --up:#ff4d4f; --dn:#00c853; --acc:#3b82f6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body{padding-bottom:24px}
  header{position:sticky;top:0;z-index:20;background:rgba(11,14,19,.96);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
  .logo{font-weight:700;font-size:15px;letter-spacing:.5px}
  .logo b{color:var(--acc)}
  .spacer{flex:1}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dn);box-shadow:0 0 6px var(--dn)}
  .dot.off{background:var(--up);box-shadow:0 0 6px var(--up)}
  .meta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
  .iconbtn:active{transform:scale(.96)}
  .iconbtn.on{color:var(--txt);border-color:#2f4a6f;background:#16243a}
  .tabs{display:flex;padding:0 12px;gap:6px}
  .tab{flex:1;text-align:center;padding:9px 0 10px;font-size:14px;color:var(--dim);
    border-bottom:2px solid transparent;cursor:pointer;font-weight:600}
  .tab.on{color:var(--txt);border-bottom-color:var(--acc)}
  .tab .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;
    background:#243044;color:#9fb4cf;border-radius:8px;font-size:10px;line-height:15px}
  main{padding:10px 12px}
  .rowline{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .rowline::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:var(--panel);
    border:1px solid var(--line);color:var(--dim);font-size:12px;cursor:pointer;white-space:nowrap}
  .chip.on{background:#16243a;border-color:#2f4a6f;color:#cfe0f5}
  .slider{display:flex;align-items:center;gap:8px;padding:2px 2px 10px;color:var(--dim);font-size:11px}
  input[type=range]{flex:1;accent-color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  #moveBody{overflow-x:auto;-webkit-overflow-scrolling:touch}
  th{position:sticky;top:0;background:var(--bg);color:var(--dim2);font-weight:600;
    font-size:11px;text-align:right;padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:nth-child(1),td:nth-child(1){text-align:left}
  td{padding:7px 5px;text-align:right;border-bottom:1px solid #171d26;white-space:nowrap}
  tr.hit td{background:#1b1218}
  .sym{font-weight:600;font-size:12.5px}
  .sym small{display:block;font-weight:400;color:var(--dim2);font-size:10px}
  .up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--dim)}
  .num{font-size:12px}
  .tag{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;
    background:#1e2836;color:#9fb4cf;margin-left:4px}
  .tag.hot{background:#3a1d20;color:#ff8b8d}
  .tag.cold{background:#12301f;color:#6ee7a8}
  .empty{text-align:center;color:var(--dim2);padding:36px 10px;font-size:12.5px;line-height:1.8}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;overflow:hidden}
  .card .top{display:flex;align-items:baseline;gap:8px;min-width:0}
  .card .top .sym{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .px{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;flex:0 0 auto}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px;margin-top:9px}
  .kv{min-width:0}
  .kv i{display:block;font-style:normal;color:var(--dim2);font-size:10px;margin-bottom:1px}
  .kv b{font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;display:block;
    overflow:hidden;text-overflow:ellipsis}
  .rng{position:relative;height:4px;border-radius:2px;background:#1e2836;margin-top:10px}
  .rng .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#2b4a6f,#3b82f6)}
  .rng .pin{position:absolute;top:-2px;width:2px;height:8px;background:#fff;border-radius:1px}
  .rnglab{display:flex;justify-content:space-between;color:var(--dim2);font-size:10px;margin-top:3px}
  .addbox{display:flex;gap:6px;margin-bottom:10px}
  .addbox input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:9px 10px;font-size:13px;outline:none}
  .addbox input:focus{border-color:#2f4a6f}
  .addbox button{background:#16243a;border:1px solid #2f4a6f;color:#cfe0f5;border-radius:8px;
    padding:0 14px;font-size:13px;cursor:pointer}
  .foot{color:var(--dim2);font-size:10.5px;text-align:center;padding:14px 8px 4px;line-height:1.7}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;
    background:#1d2735;border:1px solid #2f4a6f;color:#dbe7f5;padding:8px 14px;border-radius:999px;
    font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="logo">交易<b>机会</b></span>
    <span class="dot off" id="dot"></span>
    <span class="meta" id="meta">连接中…</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnSound">声音</button>
    <button class="iconbtn" id="btnPause">暂停</button>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="move">市场异动<span class="badge" id="badgeMove">0</span></div>
    <div class="tab" data-tab="watch">盯合约<span class="badge" id="badgeWatch">0</span></div>
    <div class="tab" data-tab="ma99">MA99<span class="badge" id="badgeMa99">0</span></div>
  </div>
</header>

<main>
  <!-- 市场异动 -->
  <section id="viewMove">
    <div class="rowline" id="boards">
      <button class="chip on" data-board="up">急涨</button>
      <button class="chip" data-board="down">急跌</button>
      <button class="chip" data-board="oi">持仓骤变</button>
      <button class="chip" data-board="fund">资金费率</button>
      <button class="chip" data-board="amp">24h 振幅</button>
    </div>
    <div class="rowline" id="wins">
      <button class="chip" data-win="60">1 分钟</button>
      <button class="chip on" data-win="180">3 分钟</button>
      <button class="chip" data-win="300">5 分钟</button>
      <button class="chip" data-win="900">15 分钟</button>
    </div>
    <div class="slider">
      <span>24h 成交额 ≥</span>
      <input type="range" id="minQuote" min="0" max="8" step="1" value="6">
      <span id="minQuoteLab" style="min-width:54px;text-align:right">100万 U</span>
    </div>
    <div id="moveBody"></div>
  </section>

  <!-- 盯合约 -->
  <section id="viewWatch" style="display:none">
    <div class="addbox">
      <input id="addInput" list="symList" placeholder="输入合约名，如 BTC_USDT / ETH">
      <datalist id="symList"></datalist>
      <button id="btnAdd">盯住</button>
    </div>
    <div class="rowline" style="padding-bottom:10px">
      <button class="chip" id="btnTop10">导入成交额前 10</button>
      <button class="chip" id="btnClear">清空自选</button>
      <button class="chip" id="btnAlert">预警阈值</button>
    </div>
    <div id="watchBody"></div>
  </section>

  <!-- MA99 回踩（币安 U 本位日线） -->
  <section id="viewMa99" style="display:none">
    <div class="rowline" id="maPreset">
      <button class="chip" data-preset="wide">宽 · 溢价10% 距8%</button>
      <button class="chip on" data-preset="std">标准 · 溢价12% 距6%</button>
      <button class="chip" data-preset="tight">严 · 溢价15% 距3%</button>
    </div>
    <div class="rowline" style="padding-bottom:8px">
      <button class="chip" id="btnMaScan">扫描 / 刷新</button>
      <button class="chip" id="btnMaCsv">导出命中</button>
      <span class="chip" id="maHint" style="cursor:default">未扫描</span>
    </div>
    <div class="slider">
      <span>24h 成交额 ≥</span>
      <input type="range" id="maMinQuote" min="0" max="7" step="1" value="5">
      <span id="maMinQuoteLab" style="min-width:54px;text-align:right">1000万 U</span>
    </div>
    <div id="ma99Body"></div>
  </section>

  <div class="foot">
    异动 / 盯合约：Gate 永续公开接口，每 5 秒刷新；MA99 回踩：币安 U 本位日线，扫一次缓存 12 小时 · 涨红跌绿<br>
    短周期涨跌与持仓变化由本机滚动采样计算，首次打开需等待所选窗口累积
  </div>
</main>

<div id="toast"></div>

<script>
"use strict";

/* ---------- 常量 ---------- */
const API_TICK = "https://api.gateio.ws/api/v4/futures/usdt/tickers";
const API_CON  = "https://api.gateio.ws/api/v4/futures/usdt/contracts";
const POLL_MS  = 5000;
const CAP      = 200;              // 环形缓冲格数（200 x 5s = 16.7 分钟）
const TOPN     = 30;

/* ---------- 状态 ---------- */
const S = {
  tick: new Map(),        // 合约 -> {p, chg24, hi, lo, vq, size, mult, fund, mark, idx}
  meta: new Map(),        // 合约 -> {interval, next, longU, shortU, delist, status, levMax}
  syms: [], idx: new Map(),
  ring: [], pos: 0, N: 0,
  lastTickAt: 0, ok: false,
  win: 180, board: "up", tab: "move", minQuote: 1e6,
  pins: load("radar.pins", []),
  sound: load("radar.sound", true),
  alertPct: load("radar.alertPct", 1.5),
  alertFund: load("radar.alertFund", 0.001),
  paused: false,
  fired: new Map(),       // 预警去重
  hist: new Map(),        // 自选合约的 1 分钟 K 线缓存（启动时预热，免等 15 分钟）
  histTs: new Map(),      // 上面缓存的抓取时刻，超过 2 分钟就重拉
  rows: [],               // 最近一次计算结果
};

function load(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v===null?d:v; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
/* 转义：所有来自接口的字符串（合约名等）插入 HTML 前必须过一遍，
   否则接口若返回带尖括号的名字，页面会把它当标签执行 */
const ESC_MAP = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC_MAP[c]);
const fmtP = p => {
  if(!isFinite(p)) return "—";
  if(p >= 1000) return p.toFixed(2);
  if(p >= 10)   return p.toFixed(3);
  if(p >= 1)    return p.toFixed(4);
  if(p >= 0.01) return p.toFixed(5);
  return p.toPrecision(4);
};
const fmtU = v => {
  if(!isFinite(v)) return "—";
  const a = Math.abs(v);
  if(a >= 1e8) return (v/1e8).toFixed(2) + "亿";
  if(a >= 1e4) return (v/1e4).toFixed(a >= 1e6 ? 0 : 1) + "万";
  return v.toFixed(0);
};
const pct = (v, d=2) => (!isFinite(v) ? "—" : (v>0?"+":"") + (v*100).toFixed(d) + "%");
const cls = v => (!isFinite(v) || Math.abs(v) < 1e-9) ? "flat" : (v > 0 ? "up" : "dn");
const hhmmss = ts => {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
};
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
let ac = null;
function beep(times){
  if(!S.sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    for(let i=0;i<(times||1);i++){
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = 880;
      const t0 = ac.currentTime + i*0.18;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.12);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+0.14);
    }
  }catch(e){}
}

/* ---------- 环形缓冲 ---------- */
function ensureRing(n){
  if(n === S.N && S.ring.length) return;
  S.N = n;
  S.ring = new Array(CAP);
  for(let i=0;i<CAP;i++) S.ring[i] = { t:0, p:new Float64Array(n), v:new Float64Array(n), s:new Float64Array(n) };
  S.pos = 0;
}
function pushSnap(ts){
  ensureRing(S.syms.length);
  const slot = S.ring[S.pos];
  slot.t = ts;
  for(let i=0;i<S.syms.length;i++){
    const r = S.tick.get(S.syms[i]);
    slot.p[i] = r ? r.p : 0;
    slot.v[i] = r ? r.vq : 0;
    slot.s[i] = r ? r.size : 0;
  }
  S.pos = (S.pos + 1) % CAP;
}
// 从新到旧扫描，取第一格时间 ≤ target 的（= 最接近目标的已采样本）
function baseAt(target){
  for(let k=0;k<CAP;k++){
    const i = (S.pos - 1 - k + 2*CAP) % CAP;
    const slot = S.ring[i];
    if(!slot || !slot.t) continue;
    if(slot.t <= target) return slot;
  }
  return null;
}

/* ---------- 取数 ---------- */
async function fetchJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function loadMeta(){
  try{
    const arr = await fetchJSON(API_CON);
    for(const c of arr){
      S.meta.set(c.name, {
        interval: c.funding_interval || 28800,
        next: c.funding_next_apply || 0,
        longU: c.long_users || 0,
        shortU: c.short_users || 0,
        delist: !!c.in_delisting,
        status: c.status || "",
        levMax: parseFloat(c.leverage_max) || 0,
      });
    }
    fillDatalist();
  }catch(e){ console.warn("contracts 拉取失败", e); }
}
/* 自选合约预热：拉 1 分钟 K 线，免等窗口累积 */
async function primePin(name){
  if(S.idx.get(name) === undefined) return;
  if(S.hist.has(name) && Date.now() - (S.histTs.get(name)||0) < 120000) return;
  try{
    const url = "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract="
              + encodeURIComponent(name) + "&interval=1m&limit=200";
    const arr = await fetchJSON(url);
    const pts = [];
    for(const k of arr){
      const c = parseFloat(k.c);
      if(c > 0) pts.push({ t:(parseInt(k.t,10) + 60)*1000, p:c });   // t = 开盘秒，转收盘毫秒
    }
    pts.sort((a,b)=>a.t-b.t);
    if(pts.length){ S.hist.set(name, pts); S.histTs.set(name, Date.now()); }
  }catch(e){ console.warn("预热失败", name, e); }
}
function primeAll(){
  for(const n of S.pins) primePin(n);
}
function oldestT(){
  let m = Infinity;
  for(const s of S.ring) if(s && s.t && s.t < m) m = s.t;
  return isFinite(m) ? m : 0;
}
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  if(sec >= 60) return Math.floor(sec/60) + " 分 " + String(sec%60).padStart(2,"0") + " 秒";
  return sec + " 秒";
}

async function tick(){
  if(S.paused) return;
  try{
    const arr = await fetchJSON(API_TICK);
    const now = Date.now();
    for(const t of arr){
      const name = t.contract;
      if(!name) continue;
      let i = S.idx.get(name);
      if(i === undefined){ i = S.syms.length; S.idx.set(name, i); S.syms.push(name); }
      const last = parseFloat(t.last) || parseFloat(t.mark_price) || 0;
      S.tick.set(name, {
        p: last,
        mark: parseFloat(t.mark_price) || last,
        chg24: parseFloat(t.change_percentage) / 100 || 0,
        hi: parseFloat(t.high_24h) || 0,
        lo: parseFloat(t.low_24h) || 0,
        vq: parseFloat(t.volume_24h_quote) || 0,
        size: parseFloat(t.total_size) || 0,
        mult: parseFloat(t.quanto_multiplier) || 1,
        fund: parseFloat(t.funding_rate) || 0,
      });
    }
    S.ok = true; S.lastTickAt = now;
    pushSnap(now);
    compute();
    render();
    paintStatus();
  }catch(e){
    S.ok = false; paintStatus(String(e.message||e));
  }
}
function paintStatus(err){
  $("#dot").className = "dot" + (S.ok ? "" : " off");
  $("#meta").textContent = S.ok
    ? `更新 ${hhmmss(S.lastTickAt)} · ${S.tick.size} 个合约`
    : ("连接失败，重试中…" + (err ? "（" + err + "）" : ""));
}

/* ---------- 计算 ---------- */
function compute(){
  const base = baseAt(S.lastTickAt - S.win*1000);
  const out = [];
  for(const name of S.syms){
    const r = S.tick.get(name);
    if(!r || !r.p) continue;
    const m = S.meta.get(name) || {};
    if(m.delist || (m.status && m.status !== "trading")) continue;
    const i = S.idx.get(name);
    let wChg = NaN, oiChg = NaN;
    if(base && base.p[i] > 0){
      const dt = (S.lastTickAt - base.t)/1000;
      if(dt >= S.win*0.6){                       // 样本跨度足够才认
        wChg = (r.p - base.p[i]) / base.p[i];
        if(base.s[i] > 0) oiChg = (r.size - base.s[i]) / base.s[i];
      }
    }
    const oiNotional = r.size * r.mult * r.p;
    const amp = (r.hi > 0 && r.lo > 0) ? (r.hi - r.lo)/r.lo : NaN;
    const pos24 = (r.hi > r.lo) ? (r.p - r.lo)/(r.hi - r.lo) : 0.5;
    const ud = (m.longU > 0 && m.shortU > 0) ? m.longU / m.shortU : NaN;
    // 窗口涨跌缺失时，用启动时预热的 1 分钟 K 线补（只覆盖自选合约）
    let wSrc = isFinite(wChg) ? "ring" : "";
    if(!isFinite(wChg)){
      const h = S.hist.get(name);
      if(h && h.length){
        const target = S.lastTickAt - S.win*1000;
        let b = null;
        for(const x of h){ if(x.t <= target) b = x; else break; }
        if(b && b.p > 0 && (target - b.t) <= 120000){ wChg = (r.p - b.p)/b.p; wSrc = "kline"; }
      }
    }
    out.push({ name, p:r.p, chg24:r.chg24, wChg, oiChg, oiNotional,
               vq:r.vq, hi:r.hi, lo:r.lo, amp, pos24, fund:r.fund, wSrc,
               interval:m.interval||28800, next:m.next||0, ud, levMax:m.levMax||0 });
  }
  S.rows = out;
  const moves = out.filter(x => x.vq >= S.minQuote);
  let hit = 0;
  for(const x of moves) if(isFinite(x.wChg) && Math.abs(x.wChg) >= S.alertPct/100) hit++;
  $("#badgeMove").textContent = hit;
  $("#badgeWatch").textContent = S.pins.length;
}

/* ---------- 排序 ---------- */
function boardRows(){
  const arr = S.rows.filter(x => x.vq >= S.minQuote);
  const ok = v => isFinite(v);
  const alt = x => isFinite(x.wChg) ? x.wChg : x.chg24;   // 窗口未就绪时退回 24h
  switch(S.board){
    case "up":     return arr.sort((a,b)=>alt(b)-alt(a)).slice(0,TOPN);
    case "down":   return arr.sort((a,b)=>alt(a)-alt(b)).slice(0,TOPN);
    case "oi":     return arr.filter(x=>ok(x.oiChg)).sort((a,b)=>Math.abs(b.oiChg)-Math.abs(a.oiChg)).slice(0,TOPN);
    case "fund":   return arr.slice().sort((a,b)=>Math.abs(b.fund)-Math.abs(a.fund)).slice(0,TOPN);
    case "amp":    return arr.filter(x=>ok(x.amp)).sort((a,b)=>b.amp-a.amp).slice(0,TOPN);
  }
  return [];
}

  if(!isFinite(fund) || !interval) return NaN;

function checkAlerts(){
  const now = Date.now();
  for(const x of S.rows){
    if(!S.pins.includes(x.name)) continue;
    const reasons = [];
    if(isFinite(x.wChg) && Math.abs(x.wChg) >= S.alertPct/100) reasons.push(`${S.win/60}分钟 ${pct(x.wChg)}`);
    if(isFinite(x.fund) && Math.abs(x.fund) >= S.alertFund) reasons.push(`资金费率 ${pct(x.fund,4)}`);
    if(!reasons.length) continue;
    const last = S.fired.get(x.name) || 0;
    if(now - last < 5*60000) continue;
    S.fired.set(x.name, now);
    const base = x.name.replace("_USDT","");
    toast(`${base}：${reasons.join(" · ")}`);
    beep(2);
  }
}

const BIN    = "https://fapi.binance.com";
const MA_KEY = "opp.ma99.v1";
const MA_TTL = 12 * 3600 * 1000;          // 12 小时内复用缓存，不重复扫
const M = {
  data: null,          // { ts, items: { BTCUSDT: {ma99, prem, peak, peak_date, bars} } }
  scanning: false, done: 0, total: 0,
  prem: 0.12, tol: 0.06, deep: 0.05, minq: 5e6,

  rows: [],
};

/* 一次拉全市场 24h 行情：现价 + 成交额，用来把「距 MA99」换算成实时值 */
async function maPollLive(){
  try{
    const arr = await fetchJSON(BIN + "/fapi/v1/ticker/24hr");
    const m = new Map();
    for(const t of arr){
      m.set(t.symbol, {
        p  : parseFloat(t.lastPrice) || 0,
        vq : parseFloat(t.quoteVolume) || 0,
      });
    }
    M.live = m; M.liveAt = Date.now();
    maCompute();
    if(S.tab === "ma99") maRender();
  }catch(e){ /* 轮询失败静默，下一分钟再来 */ }
}

function maCompute(){
  const items = (M.data && M.data.items) || {};
  const rows = [];
  for(const sym in items){
    const it = items[sym];
    const lv = M.live.get(sym);
    const p  = lv ? lv.p : NaN;
    const q24 = lv ? lv.vq : 0;
    const ma = it.ma99;
    const dist = (isFinite(p) && ma > 0) ? p / ma - 1 : NaN;
    const drop = (isFinite(p) && it.peak > 0) ? p / it.peak - 1 : NaN;
    /* 现价与日线口径差太远（同名不同计价的合约）直接不认，避免假命中 */
    const sane = isFinite(dist) && Math.abs(dist) < 0.9;
    const qok  = (M.live.size === 0) || (q24 >= M.minq);
    const hit  = sane && it.prem >= M.prem && Math.abs(dist) <= M.tol
                 && drop <= -M.deep && qok;
    const days = it.peak_date
      ? Math.max(0, Math.round((Date.now() - Date.parse(it.peak_date + "T00:00:00Z")) / 86400000))
      : NaN;
    rows.push({ sym, p, ma, dist, drop, prem: it.prem, peak: it.peak,
                peak_date: it.peak_date, q24, days, hit });
  }
  M.rows = rows;
  const b = $("#badgeMa99");
  if(b) b.textContent = rows.filter(x => x.hit).length;
  return rows;
}

  }
  const H = ["合约", "现价", "MA99", "距 MA99", "上冲溢价", "峰值日", "距峰值", "上冲后", "24h 成交额"];
  let html = `<div class="foot" style="padding:0 2px 8px;text-align:left">${stats}`

async function maScan(){
  if(M.scanning) return;
  M.scanning = true; M.done = 0; M.total = 0;
  maHint("扫描中…", false);
  if(S.tab === "ma99") maRender();
  let info;
  try{
    info = await fetchJSON(BIN + "/fapi/v1/exchangeInfo");
  }catch(e){
    M.scanning = false;
    maHint("币安连不上", true);
    toast("币安接口失败：" + (e.message || e));
    if(S.tab === "ma99") maRender();
    return;
  }
  const syms = info.symbols
    .filter(s => s.contractType === "PERPETUAL" && s.status === "TRADING" && s.quoteAsset === "USDT")
    .map(s => s.symbol).sort();
  M.total = syms.length;
  if(S.tab === "ma99") maRender();

  const items = {};
  let cursor = 0;
  const one = async (sym) => {
    try{
      const k = await fetchJSON(`${BIN}/fapi/v1/klines?symbol=${encodeURIComponent(sym)}&interval=1d&limit=160`);
      if(k && k.length >= 101){
        /* 最后一根是今天没走完的日线，剔除；MA99 只用已收盘日线 */
        const body  = k.slice(0, -1);
        const closes = body.map(x => parseFloat(x[4]));
        const highs  = body.map(x => parseFloat(x[2]));
        const opens  = body.map(x => parseFloat(x[0]));
        const n = closes.length;
        if(n >= 99){
          let s99 = 0;
          for(let i = n - 99; i < n; i++) s99 += closes[i];
          const ma99 = s99 / 99;
          if(ma99 > 0){
            /* 逐日回看最近 lookback 天：当天最高价相对当天 MA99 的最大溢价 */
            const lb = Math.min(60, n - 98);
            let best = -9.9, bj = -1;
            for(let j = n - lb; j < n; j++){
              let m = 0;
              for(let i = j - 98; i <= j; i++) m += closes[i];
              m /= 99;
              if(!(m > 0)) continue;
              const pr = highs[j] / m - 1;
              if(pr > best){ best = pr; bj = j; }
            }
            if(bj >= 0){
              items[sym] = {
                ma99, prem: best, peak: highs[bj],
                peak_date: new Date(opens[bj]).toISOString().slice(0, 10),
              };
            }
          }
        }
      }
    }catch(e){ /* 单个合约失败跳过 */ }
    M.done++;
    if(S.tab === "ma99" && M.done % 20 === 0) maRender();
  };
  const pool = Array.from({ length: 8 }, async () => {
    while(cursor < syms.length) await one(syms[cursor++]);
  });
  await Promise.all(pool);

  M.data = { ts: Date.now(), items };
  save(MA_KEY, M.data);
  M.scanning = false;
  maCompute();
  if(S.tab === "ma99") maRender();
  const got = Object.keys(items).length;
  maHint(`已扫 ${got} 个合约`, got < 100);
  toast(`MA99 扫描完成：${got} 个可算`);
}

/* ---------- MA99 交互 ---------- */
document.querySelectorAll("#maPreset .chip").forEach(el => {
  el.onclick = () => {
    document.querySelectorAll("#maPreset .chip").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    const k = el.dataset.preset;
    if(k === "wide"){ M.prem = 0.10; M.tol = 0.08; }
    else if(k === "tight"){ M.prem = 0.15; M.tol = 0.03; }
    else { M.prem = 0.12; M.tol = 0.06; }
    maCompute();
    if(S.tab === "ma99") maRender();
  };
});
$("#btnMaScan").onclick = () => maScan();
$("#btnMaCsv").onclick = () => {
  const rows = M.rows.filter(x => x.hit);
  if(!rows.length){ toast("当前没有命中，先扫描或放宽门槛"); return; }
  const head = "symbol,price,ma99,dist,prem,peak,peak_date,drop,days,q24";
  const body = rows.map(x => [x.sym, x.p, x.ma, x.dist, x.prem, x.peak,
                              x.peak_date, x.drop, x.days, x.q24].join(","));
  const blob = new Blob(["\ufeff" + head + "\n" + body.join("\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "交易机会_MA99回踩_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast(`已导出 ${rows.length} 条`);
};
$("#maMinQuote").oninput = e => {
  M.minq = QUOTE_STEPS[parseInt(e.target.value, 10)] || 0;
  $("#maMinQuoteLab").textContent = fmtU(M.minq) + " U";
  maCompute();
  if(S.tab === "ma99") maRender();
};

/* 启动：先读缓存，再拉一次实时价；缓存过期只提示，不自动扫 */
M.data = load(MA_KEY, null);
M.minq = QUOTE_STEPS[parseInt($("#maMinQuote").value, 10)] || 0;
$("#maMinQuoteLab").textContent = fmtU(M.minq) + " U";
maCompute();
if(M.data){
  const age = Math.round((Date.now() - M.data.ts) / 60000);
  maHint(age > MA_TTL / 60000 ? `缓存 ${Math.round(age / 60)} 小时，建议重扫` : `缓存 ${age} 分钟前`,
         age > MA_TTL / 60000);
}
maPollLive();
setInterval(maPollLive, 60000);

/* ---------- 启动 ---------- */
/* 对外只留一个参数：?tab=move|watch|ma99，方便把某个标签页存成书签 */
{
  const t = new URLSearchParams(location.search).get("tab");
  const el = t && document.querySelector(`.tab[data-tab="${t}"]`);
  if(el) el.click();
}
$("#btnSound").classList.toggle("on", S.sound);
$("#minQuoteLab").textContent = fmtU(S.minQuote) + " U";
$("#minQuote").value = QUOTE_STEPS.indexOf(1e6);
loadMeta();
tick().then(()=>{
  compute(); primeAll();
  setTimeout(()=>{ compute(); render(); }, 6000);
});
setInterval(tick, POLL_MS);
setInterval(()=>{ if(!S.paused){ primeAll(); compute(); render(); } }, 30000); // 倒计时 / 预热缓存兜底刷新
</script>
